apiVersion: apps/v1
kind: Deployment
metadata: {name: foodiguard-api}
spec:
  selector: {matchLabels: {app: foodiguard-api}}
  strategy: {rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  template:
    metadata: {labels: {app: foodiguard-api}}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: foodiguard-api
        image: {{ include "foodiguard.apiImage" . }}
        ports: [{name: http, containerPort: 8080}]
        env:
{{ include "foodiguard.dbEnv" . | indent 8 }}
        - {name: DB_POOL_MAX, value: "3"}
        - {name: SEARCH_CONCURRENCY, value: "1"}
        - {name: SEARCH_QUEUE_MAX, value: "10"}
        - name: AUTH_TOKEN_SECRET
          valueFrom: {secretKeyRef: {name: auth-credentials, key: AUTH_TOKEN_SECRET}}
        readinessProbe: {httpGet: {path: /api/health/ready, port: http}, periodSeconds: 5, timeoutSeconds: 3}
        livenessProbe: {httpGet: {path: /api/health/live, port: http}, periodSeconds: 10, timeoutSeconds: 3}
        resources: {requests: {cpu: 100m, memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: foodiguard-api}
spec:
  selector: {app: foodiguard-api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: foodiguard-web}
spec:
  replicas: 1
  selector: {matchLabels: {app: foodiguard-web}}
  template:
    metadata: {labels: {app: foodiguard-web}}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: web
        image: "{{ .Values.registry }}/foodiguard-web:{{ required "set tag" .Values.tag }}"
        env: [{name: API_UPSTREAM, value: "http://foodiguard-api:8080"}]
        ports: [{name: http, containerPort: 80}]
        readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: foodiguard-web}
spec:
  type: NodePort
  selector: {app: foodiguard-web}
  ports: [{port: 80, targetPort: http, nodePort: 30080}]
