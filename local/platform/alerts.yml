groups:
- name: foodiguard
  rules:
  - alert: api_5xx
    expr: >-
      ((sum(rate(foodiguard_http_requests_total{route!~"/api/health.*",status_class="5xx"}[5m])) or vector(0)) / clamp_min(sum(rate(foodiguard_http_requests_total{route!~"/api/health.*"}[5m])), 0.001)) > 0.05
    for: 300s
    annotations: {summary: "FoodiGuard API 5xx 오류율"}
  - alert: api_latency
    expr: >-
      histogram_quantile(0.95, sum by (le, route) (rate(foodiguard_http_request_duration_seconds_bucket[5m]))) > 1
    for: 600s
    annotations: {summary: "FoodiGuard API p95 지연"}
  - alert: db_latency
    expr: >-
      histogram_quantile(0.95, sum by (le, operation) (rate(foodiguard_db_query_duration_seconds_bucket[5m]))) > 0.5
    for: 600s
    annotations: {summary: "FoodiGuard DB p95 지연"}
  - alert: api_availability
    expr: >-
      (max(up{job="foodiguard-api"}) == 0) or absent(up{job="foodiguard-api"})
    for: 180s
    annotations: {summary: "FoodiGuard API 가용성"}
  - alert: container_restart
    expr: >-
      sum(increase(kube_pod_container_status_restarts_total{pod=~"foodiguard-api-.*|foodiguard-web-.*"}[10m])) > 0
    for: 0s
    annotations: {summary: "FoodiGuard 컨테이너 재시작"}
  - alert: data_freshness
    expr: >-
      (time() - max(foodiguard_sync_last_success_timestamp_seconds{operation="allergen_projection"})) > 93600 or max(absent(foodiguard_sync_last_success_timestamp_seconds{operation="allergen_projection"}))
    for: 600s
    annotations: {summary: "FoodiGuard 알레르기 재계산 지연"}
  - alert: data_quality_collection
    expr: >-
      (time() - foodiguard_data_quality_last_refresh_timestamp_seconds) > 900 or absent(foodiguard_data_quality_last_refresh_timestamp_seconds)
    for: 300s
    annotations: {summary: "FoodiGuard 데이터 품질 수집 중단"}
  - alert: sync_failure
    expr: >-
      foodiguard_sync_failures_24h{operation="allergen_projection"} > 0
    for: 0s
    annotations: {summary: "FoodiGuard 알레르기 재계산 실패"}
  - alert: ingredient_match_ratio
    expr: >-
      foodiguard_ingredient_match_ratio < 0.95
    for: 600s
    annotations: {summary: "FoodiGuard 원재료 매칭률 하락"}
  - alert: nutrition_missing_ratio
    expr: >-
      foodiguard_nutrition_missing_ratio > 0.01
    for: 600s
    annotations: {summary: "FoodiGuard 영양정보 누락률 상승"}
