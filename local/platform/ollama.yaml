apiVersion: v1
kind: Service
metadata: {name: ollama}
spec:
  selector: {app: ollama}
  ports: [{port: 11434}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: ollama}
spec:
  serviceName: ollama
  replicas: 1
  selector: {matchLabels: {app: ollama}}
  template:
    metadata: {labels: {app: ollama}}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: ollama
        image: alpine/ollama@sha256:43fbee7c237a8b32a9226ea80619ef21963688f53266cb7d017ccb73c62d145c
        env:
        - {name: OLLAMA_HOST, value: "0.0.0.0:11434"}
        - {name: OLLAMA_MODELS, value: /root/.ollama/models}
        - {name: OLLAMA_NUM_PARALLEL, value: "1"}
        - {name: OLLAMA_NO_CLOUD, value: "1"}
        - {name: OLLAMA_KEEP_ALIVE, value: "10m"}
        readinessProbe: {httpGet: {path: /api/tags, port: 11434}, periodSeconds: 5}
        volumeMounts: [{name: models, mountPath: /root/.ollama}]
  volumeClaimTemplates:
  - metadata: {name: models}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 2Gi}}
