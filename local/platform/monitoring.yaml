apiVersion: v1
kind: Service
metadata: {name: api-metrics}
spec:
  clusterIP: None
  selector: {app: foodiguard-api}
  ports: [{name: metrics, port: 8080}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: pod-metrics}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: read-pod-status}
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: pod-metrics}
subjects: [{kind: ServiceAccount, name: pod-metrics, namespace: foodiguard}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: read-pod-status}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pod-metrics}
spec:
  replicas: 1
  selector: {matchLabels: {app: pod-metrics}}
  template:
    metadata: {labels: {app: pod-metrics}}
    spec:
      serviceAccountName: pod-metrics
      containers:
      - name: pod-metrics
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.16.0
        args: ["--resources=pods", "--namespaces=foodiguard", "--metric-allowlist=kube_pod_container_status_restarts_total"]
---
apiVersion: v1
kind: Service
metadata: {name: pod-metrics}
spec:
  selector: {app: pod-metrics}
  ports: [{port: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: prometheus}
spec:
  replicas: 1
  serviceName: prometheus
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 65534}
      containers:
      - name: prometheus
        image: prom/prometheus:v3.5.0
        args: ["--config.file=/etc/foodiguard/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=3d", "--storage.tsdb.retention.size=450MB"]
        readinessProbe: {httpGet: {path: /-/ready, port: 9090}}
        volumeMounts:
        - {name: config, mountPath: /etc/foodiguard}
        - {name: data, mountPath: /prometheus}
      volumes:
      - name: config
        configMap: {name: foodiguard-monitoring}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 1Gi}}
