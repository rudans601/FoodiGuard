name: foodiguard-local
services:
  registry:
    image: registry:3
    volumes: [registry-data:/var/lib/registry]
    networks:
      default:
        aliases: [foodiguard-registry]
      kind:
        aliases: [foodiguard-registry]
  builder:
    image: moby/buildkit:v0.23.2-rootless
    command: ["--oci-worker-no-process-sandbox", "--config", "/etc/buildkit/buildkitd.toml"]
    security_opt: [seccomp=unconfined, apparmor=unconfined, systempaths=unconfined]
    volumes:
      - ./buildkit.toml:/etc/buildkit/buildkitd.toml:ro
      - build-socket:/run/user/1000
      - build-cache:/home/user/.local/share/buildkit
  jenkins:
    build: ./jenkins
    depends_on: [builder, registry]
    ports: ["127.0.0.1:18182:8080"]
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Xmx512m"
      BUILDKIT_HOST: unix:///run/user/1000/buildkit/buildkitd.sock
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /source.git
      GIT_CONFIG_KEY_1: safe.directory
      GIT_CONFIG_VALUE_1: /gitops.git
    volumes:
      - jenkins-data:/var/jenkins_home
      - build-socket:/run/user/1000:ro
      - ../.foodiguard-local/source.git:/source.git:ro
      - ../.foodiguard-local/gitops.git:/gitops.git
      - ../.foodiguard-local/admin-password:/run/secrets/admin-password:ro
networks:
  kind: {external: true, name: kind}
volumes:
  registry-data: {}
  build-socket: {}
  build-cache: {}
  jenkins-data: {}
